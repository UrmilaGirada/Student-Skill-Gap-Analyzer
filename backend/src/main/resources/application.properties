# ---------------------------------------------------------------------------
# Student Skill Gap Analyzer - backend configuration
# ---------------------------------------------------------------------------

# Application identity
spring.application.name=student-skill-gap-analyzer-backend

# HTTP server (8080 is the project default; change only if the port is occupied)
server.port=8080

# Actuator: expose only the health endpoint for now (info/metrics come in later phases)
management.endpoints.web.exposure.include=health

# ---------------------------------------------------------------------------
# MySQL datasource (Phase 2: persistence foundation)
# Credentials are NEVER stored in this file - they come from environment variables:
#   DB_USERNAME -> defaults to "root" when not set
#   DB_PASSWORD -> must be set in your shell (see README "Setting the DB credentials")
# -----------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# JPA / Hibernate (safe development configuration: never create/create-drop)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Resume upload limits (Phase 4): 10 MB per resume file, 12 MB per request
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------------------------------------------------------------------------
# Python AI engine (Phase 6): Spring Boot -> FastAPI integration
#   AI_ENGINE_BASE_URL overrides the base URL (development default: http://localhost:8000)
# ---------------------------------------------------------------------------
ai.engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:8000}
ai.engine.connect-timeout-ms=2000
ai.engine.read-timeout-ms=5000

